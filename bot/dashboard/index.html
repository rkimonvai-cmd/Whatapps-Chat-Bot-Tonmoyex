<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Bot Dashboard</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0a0f1a, #020408);
      color: #eafcff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(85%, 420px);
      padding: 28px;
      border: 1px solid #164e63;
      border-radius: 18px;
      background: #0c1724;
      text-align: center;
    }
    h1 { color: #5eead4; }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #0d9488;
      color: white;
      font-weight: bold;
    }
    #status { margin: 20px 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>GROUP CHAT BOT</h1>
    <p>WhatsApp Bot Status Dashboard</p>
    <p id="status">সার্ভারের ঠিকানা যোগ করো।</p>
    <button id="check">Check Status</button>
  </main>

  <script>
    const status = document.getElementById("status");

    document.getElementById("check").onclick = async () => {
      const url = prompt("তোমার Bot Server URL দাও:");
      if (!url || !url.startsWith("https://")) {
        status.textContent = "সঠিক HTTPS URL দাও।";
        return;
      }

      try {
        const response = await fetch(
          url.replace(/\/$/, "") + "/health"
        );
        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        status.textContent =
          "Server: " + data.status +
          " | WhatsApp: " + data.whatsapp;
      } catch {
        status.textContent =
          "সার্ভারে সংযোগ হয়নি। URL বা CORS সেটিং পরীক্ষা করো।";
      }
    };
  </script>
</body>
</html>
